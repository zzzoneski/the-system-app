<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>THE SYSTEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #00d4ff;
      --secondary: #0033ff;
      --background: #0a0e27;
      --surface: #1a1f3a;
      --text: #ffffff;
      --warning: #ff3333;
      --success: #00ff00;
      --safe-top: env(safe-area-inset-top, 0);
      --safe-bottom: env(safe-area-inset-bottom, 0);
    }

    body {
      font-family: 'Space Mono', monospace;
      background: var(--background);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @keyframes lightStrobe1 {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.3; }
    }

    @keyframes lightStrobe2 {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.4; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Welcome Screen */
    #welcomeScreen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: var(--safe-top) 20px var(--safe-bottom) 20px;
      background: var(--background);
      position: relative;
      overflow: hidden;
    }

    .light-streak {
      position: absolute;
      opacity: 0.1;
      pointer-events: none;
    }

    .welcome-content {
      z-index: 2;
      text-align: center;
    }

    .welcome-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 20px var(--primary);
      margin: 20px 0;
      letter-spacing: 2px;
    }

    .welcome-subtitle {
      font-size: 16px;
      margin-bottom: 40px;
      opacity: 0.8;
    }

    .welcome-name-input {
      width: 100%;
      max-width: 300px;
      padding: 12px 16px;
      margin-bottom: 20px;
      background: var(--surface);
      border: 2px solid var(--primary);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      text-align: center;
    }

    .welcome-button {
      width: 100%;
      max-width: 300px;
      padding: 14px;
      background: var(--primary);
      color: var(--background);
      border: none;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }

    .welcome-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
    }

    /* Main Screens */
    .screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      padding: var(--safe-top) 0 var(--safe-bottom) 0;
      animation: fadeIn 0.6s;
    }

    .screen.active {
      display: flex;
    }

    .screen-header {
      background: var(--surface);
      border-bottom: 2px solid var(--primary);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .back-button {
      background: none;
      border: none;
      color: var(--primary);
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      cursor: pointer;
      font-weight: 900;
    }

    .screen-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary);
      flex: 1;
      text-align: center;
      letter-spacing: 1px;
    }

    .tab-container {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--primary);
      background: var(--surface);
      overflow-x: auto;
      padding: 0 10px;
    }

    .tab-button {
      flex: 1;
      padding: 12px 16px;
      background: none;
      border: none;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .tab-button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      opacity: 1;
    }

    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* Quest Card */
    .quest-card {
      background: var(--surface);
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }

    .quest-card:hover {
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
      transform: translateY(-2px);
    }

    .quest-card-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 16px;
    }

    .quest-card-meta {
      font-size: 12px;
      opacity: 0.7;
      display: flex;
      gap: 16px;
    }

    .quest-card-withdraw {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--primary);
      font-size: 20px;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.3s;
    }

    .quest-card-withdraw:hover {
      opacity: 1;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.35s;
    }

    .modal {
      background: var(--surface);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 24px;
      max-width: 100%;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      animation: scaleIn 0.35s;
    }

    .modal::-webkit-scrollbar {
      width: 8px;
    }

    .modal::-webkit-scrollbar-track {
      background: var(--background);
    }

    .modal::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      background: var(--background);
      border: 2px solid var(--primary);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
    }

    .input-field:focus {
      outline: none;
      box-shadow: 0 0 10px var(--primary);
    }

    textarea.input-field {
      resize: vertical;
      min-height: 80px;
    }

    .confirm-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .confirm-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      font-size: 14px;
    }

    .confirm-yes {
      background: var(--success);
      color: var(--background);
    }

    .confirm-yes:hover {
      transform: scale(1.05);
    }

    .confirm-no {
      background: var(--warning);
      color: var(--text);
    }

    .confirm-no:hover {
      transform: scale(1.05);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--primary);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      opacity: 0.6;
    }

    .empty-state-text {
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* Embark Button */
    .embark-button {
      padding: 14px 28px;
      background: var(--primary);
      color: var(--background);
      border: none;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
      text-transform: uppercase;
    }

    .embark-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.8);
    }

    /* Daily Objectives */
    .daily-date {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      color: var(--primary);
      margin-bottom: 20px;
      text-align: center;
      border-bottom: 1px solid var(--primary);
      padding-bottom: 10px;
    }

    .objective-card {
      background: var(--surface);
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .objective-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .objective-description {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 12px;
    }

    .objective-meta {
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 12px;
    }

    .mark-complete-btn {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: var(--background);
      border: none;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
    }

    .mark-complete-btn:hover {
      transform: scale(1.02);
    }

    /* Habit/Skill Cards */
    .habit-card {
      background: var(--surface);
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      padding-right: 50px;
      position: relative;
    }

    .habit-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      font-size: 14px;
    }

    .habit-description {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 8px;
    }

    .habit-meta {
      font-size: 11px;
      opacity: 0.6;
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--background);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s;
    }

    .edit-button {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--primary);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .edit-button:hover {
      opacity: 1;
    }

    /* Badges Tab */
    .badges-empty {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      opacity: 0.5;
    }

    /* Settings Tab */
    .settings-empty {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      opacity: 0.5;
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .welcome-title {
        font-size: 36px;
      }

      .screen-title {
        font-size: 18px;
      }

      .tab-button {
        font-size: 10px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>
  <!-- Welcome Screen -->
  <div id="welcomeScreen" class="screen active">
    <div class="welcome-content">
      <div class="welcome-title">THE SYSTEM</div>
      <div id="welcomeSubtitle" class="welcome-subtitle">Welcome back, zone</div>
      <input type="text" id="nameInput" class="welcome-name-input" placeholder="Enter your name" style="display: none;">
      <button id="welcomeButton" class="welcome-button">ENTER</button>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="mainScreen" class="screen">
    <div class="screen-header">
      <button class="back-button" onclick="goToWelcome()">←</button>
      <div class="screen-title">THE SYSTEM</div>
      <div style="width: 24px;"></div>
    </div>
    
    <div class="tab-container">
      <button class="tab-button active" onclick="switchMainTab('quests')">QUESTS</button>
      <button class="tab-button" onclick="switchMainTab('badges')">BADGES</button>
      <button class="tab-button" onclick="switchMainTab('settings')">SETTINGS</button>
    </div>

    <div id="questsTab" class="tab-content active">
      <div id="questsList"></div>
      <div id="noQuestsState" class="empty-state" style="display: none;">
        <div class="empty-state-text">No active quests. Start your journey.</div>
        <button class="embark-button" onclick="showEmbarkModal()">EMBARK ON A QUEST</button>
      </div>
    </div>

    <div id="badgesTab" class="tab-content">
      <div class="badges-empty">Coming soon</div>
    </div>

    <div id="settingsTab" class="tab-content">
      <div class="settings-empty">Coming soon</div>
    </div>
  </div>

  <!-- Quest Dashboard -->
  <div id="questScreen" class="screen">
    <div class="screen-header">
      <button class="back-button" onclick="backToMain()">←</button>
      <div class="screen-title" id="questScreenTitle">Quest</div>
      <div style="width: 24px;"></div>
    </div>

    <div class="tab-container">
      <button class="tab-button active" onclick="switchQuestTab('daily')">DAILY</button>
      <button class="tab-button" onclick="switchQuestTab('habits')">HABITS</button>
      <button class="tab-button" onclick="switchQuestTab('skills')">SKILLS</button>
      <button class="tab-button" onclick="switchQuestTab('goals')">GOALS</button>
      <button class="tab-button" onclick="switchQuestTab('rewards')">REWARDS</button>
    </div>

    <div id="dailyTab" class="tab-content active"></div>
    <div id="habitsTab" class="tab-content"></div>
    <div id="skillsTab" class="tab-content"></div>
    <div id="goalsTab" class="tab-content"></div>
    <div id="rewardsTab" class="tab-content"></div>
  </div>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay">
    <div id="modal" class="modal"></div>
  </div>

  <script>
    let userName = '';
    let quests = [];
    let currentQuestId = null;
    let apiKey = localStorage.getItem('theSystemApiKey') || '';

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('theSystemUserName');
      const savedQuests = localStorage.getItem('theSystemQuests');

      if (savedName) {
        userName = savedName;
        document.getElementById('nameInput').style.display = 'none';
        document.getElementById('welcomeSubtitle').textContent = `Welcome back, ${userName}`;
      } else {
        document.getElementById('nameInput').style.display = 'block';
        document.getElementById('welcomeSubtitle').textContent = 'Welcome to';
      }

      if (savedQuests) {
        quests = JSON.parse(savedQuests);
      }

      document.getElementById('welcomeButton').onclick = handleWelcome;
    });

    function handleWelcome() {
      const input = document.getElementById('nameInput');
      if (input.style.display !== 'none' && input.value.trim()) {
        userName = input.value.trim();
        localStorage.setItem('theSystemUserName', userName);
      }
      goToMain();
    }

    function goToMain() {
      document.getElementById('welcomeScreen').classList.remove('active');
      document.getElementById('mainScreen').classList.add('active');
      renderQuestsList();
    }

    function goToWelcome() {
      document.getElementById('mainScreen').classList.remove('active');
      document.getElementById('questScreen').classList.remove('active');
      document.getElementById('welcomeScreen').classList.add('active');
    }

    function backToMain() {
      document.getElementById('questScreen').classList.remove('active');
      document.getElementById('mainScreen').classList.add('active');
      renderQuestsList();
    }

    function switchMainTab(tab) {
      document.querySelectorAll('#mainScreen .tab-button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('#mainScreen .tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
    }

    function switchQuestTab(tab) {
      document.querySelectorAll('#questScreen .tab-button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('#questScreen .tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
      renderQuestTabContent(tab);
    }

    function renderQuestsList() {
      const listDiv = document.getElementById('questsList');
      const noQuestsDiv = document.getElementById('noQuestsState');

      if (quests.length === 0) {
        listDiv.innerHTML = '';
        noQuestsDiv.style.display = 'flex';
      } else {
        noQuestsDiv.style.display = 'none';
        listDiv.innerHTML = quests.map(quest => `
          <div class="quest-card" onclick="selectQuest('${quest.id}')">
            <div class="quest-card-title">${quest.name}</div>
            <div class="quest-card-meta">
              <span>${quest.timeline}</span>
              <span>${getHoursPerWeek(quest.commitmentLevel)} hrs/week</span>
            </div>
            <button class="quest-card-withdraw" onclick="withdrawQuest('${quest.id}', event)">×</button>
          </div>
        `).join('');
      }
    }

    function getHoursPerWeek(level) {
      const map = { 'low': '0-5', 'medium': '5-10', 'high': '10+' };
      return map[level] || '0-5';
    }

    function selectQuest(questId) {
      currentQuestId = questId;
      const quest = quests.find(q => q.id === questId);
      document.getElementById('questScreenTitle').textContent = quest.name;
      document.getElementById('mainScreen').classList.remove('active');
      document.getElementById('questScreen').classList.add('active');
      renderQuestTabContent('daily');
    }

    function renderQuestTabContent(tab) {
      const quest = quests.find(q => q.id === currentQuestId);
      if (!quest) return;

      const tabDiv = document.getElementById(tab + 'Tab');

      if (tab === 'daily') {
        const today = new Date();
        const dateStr = today.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
        const objective = quest.dailyObjectives?.[0];
        
        if (!objective) {
          tabDiv.innerHTML = '<div class="empty-state"><div class="empty-state-text">All objectives complete for the day!</div></div>';
          return;
        }

        tabDiv.innerHTML = `
          <div class="daily-date">${dateStr}</div>
          <div class="objective-card">
            <div class="objective-title">${objective.title}</div>
            <div class="objective-description">${objective.description}</div>
            <div class="objective-meta">Duration: ${objective.duration}</div>
            <button class="mark-complete-btn" onclick="completeObjective('${quest.id}', '${objective.id}')">MARK COMPLETE</button>
          </div>
        `;
      } else if (tab === 'habits') {
        tabDiv.innerHTML = (quest.habits || []).map(habit => {
          const progress = (habit.currentPoints || 0) / 20 * 100;
          return `
            <div class="habit-card">
              <div class="habit-name">${habit.name}</div>
              <div class="habit-description">${habit.description}</div>
              <div class="habit-meta">${habit.daysPerWeek}x/week • ${habit.currentPoints || 0}/20 points</div>
              <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
              <div class="habit-meta">Scale: ${Math.ceil(quest.timelineInDays / 20)} days = 1 point</div>
              <button class="edit-button" onclick="editHabit('${quest.id}', '${habit.id}')">EDIT</button>
            </div>
          `;
        }).join('');
      } else if (tab === 'skills') {
        tabDiv.innerHTML = (quest.skillsets || []).map(skill => {
          const progress = (skill.currentLevel || 0) / 20 * 100;
          return `
            <div class="habit-card">
              <div class="habit-name">${skill.name}</div>
              <div class="habit-description">${skill.description}</div>
              <div class="habit-meta">Level ${skill.currentLevel || 0}/20</div>
              <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
              <div class="habit-meta">Scale: ${Math.ceil(quest.timelineInDays / 20)} days = 1 level</div>
              <button class="edit-button" onclick="editSkill('${quest.id}', '${skill.id}')">EDIT</button>
            </div>
          `;
        }).join('');
      } else if (tab === 'goals') {
        tabDiv.innerHTML = (quest.milestones || []).map(milestone => `
          <div class="habit-card">
            <div class="habit-name">${milestone.name}</div>
            <div class="habit-description">${milestone.description}</div>
            <div class="habit-meta">Target: ${milestone.targetDate}</div>
          </div>
        `).join('');
      } else if (tab === 'rewards') {
        tabDiv.innerHTML = (quest.rewards || []).map((reward, week) => `
          <div class="habit-card">
            <div class="habit-name">Week ${week}: ${reward}</div>
          </div>
        `).join('');
      }
    }

    function completeObjective(questId, objectiveId) {
      showModal(`
        <div class="modal-title">Congratulations! 🎉</div>
        <div style="text-align: center; margin: 20px 0; font-size: 14px;">
          You completed today's objective!
          <br><br>
          <strong>Rewards:</strong><br>
          ${quests.find(q => q.id === questId)?.rewards?.[0] ? '◆ ' + quests.find(q => q.id === questId).rewards[0] : 'Keep pushing!'}
        </div>
        <div class="confirm-buttons">
          <button class="confirm-btn confirm-yes" onclick="closeModal(); switchQuestTab('daily')">Continue</button>
        </div>
      `);
    }

    function withdrawQuest(questId, event) {
      event.stopPropagation();
      showModal(`
        <div class="modal-title">Withdraw Quest?</div>
        <div style="text-align: center; margin: 20px 0; font-size: 14px;">Are you sure you want to withdraw from this quest?</div>
        <div class="confirm-buttons">
          <button class="confirm-btn confirm-yes" onclick="confirmWithdraw('${questId}')">Yes, Withdraw</button>
          <button class="confirm-btn confirm-no" onclick="closeModal()">No, Stay</button>
        </div>
      `);
    }

    function confirmWithdraw(questId) {
      quests = quests.filter(q => q.id !== questId);
      localStorage.setItem('theSystemQuests', JSON.stringify(quests));
      closeModal();
      backToMain();
    }

    function showEmbarkModal() {
      showModal(`
        <div class="modal-title">New Quest</div>
        
        <div class="form-group">
          <label class="form-label">Quest Goal</label>
          <textarea id="questGoal" class="input-field" placeholder="What do you want to achieve?"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Current Progress</label>
          <textarea id="questProgress" class="input-field" placeholder="Where are you now?"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Timeline</label>
          <input type="text" id="questTimeline" class="input-field" placeholder="e.g., 12 weeks">
        </div>

        <div class="form-group">
          <label class="form-label">Commitment Level</label>
          <select id="questCommitment" class="input-field">
            <option value="low">Low (0-5 hrs/week)</option>
            <option value="medium">Medium (5-10 hrs/week)</option>
            <option value="high" selected>High (10+ hrs/week)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">NVIDIA NIM API Key</label>
          <input type="password" id="apiKeyInput" class="input-field" placeholder="Paste your API key">
          <div style="font-size: 11px; color: var(--primary); opacity: 0.6; margin-top: 6px;">
            Get FREE at: <a href="https://build.nvidia.com" target="_blank" style="color: var(--primary); text-decoration: underline;">build.nvidia.com</a> (no credit card)
          </div>
        </div>

        <div class="confirm-buttons" style="margin-top: 24px;">
          <button class="confirm-btn confirm-yes" style="background: var(--success); color: var(--background);" onclick="generateQuest()">GENERATE QUEST</button>
          <button class="confirm-btn confirm-no" style="background: var(--warning); color: var(--text);" onclick="closeModal()">CANCEL</button>
        </div>
      `);
    }

    async function generateQuest() {
      const goal = document.getElementById('questGoal').value;
      const progress = document.getElementById('questProgress').value;
      const timeline = document.getElementById('questTimeline').value;
      const commitment = document.getElementById('questCommitment').value;
      const apiKeyInput = document.getElementById('apiKeyInput').value;

      if (!goal || !progress || !timeline || !commitment) {
        alert('Please fill in all quest details');
        return;
      }

      if (!apiKeyInput || apiKeyInput.trim().length < 20) {
        alert('Invalid API key. Make sure you copied the entire key from build.nvidia.com');
        return;
      }

      const cleanApiKey = apiKeyInput.trim();
      apiKey = cleanApiKey;
      localStorage.setItem('theSystemApiKey', apiKey);

      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <div class="modal-title">Generating your quest...</div>
        <div style="text-align: center; padding: 40px 20px;">
          <div class="spinner"></div>
          <div style="margin-top: 16px; color: var(--primary);">NVIDIA is generating your quest breakdown...</div>
        </div>
      `;

      try {
        // Call Vercel backend proxy
        const vercelEndpoint = 'https://the-system-app-beta11.vercel.app/api/generateQuest';
        
        const response = await fetch(vercelEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            apiKey: apiKey,
            goal: goal,
            progress: progress,
            timeline: timeline,
            commitment: commitment
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || `Error: ${response.status}`);
        }

        const data = await response.json();
        if (!data.success || !data.content) {
          throw new Error('Invalid response from backend');
        }

        let content = data.content.trim();
        if (content.startsWith('```')) {
          content = content.replace(/^```json?\n?/, '').replace(/\n?```$/, '');
        }

        const breakdown = JSON.parse(content);

        // Create quest
        const timelineMatch = timeline.match(/(\d+)\s*(day|week|month|year)/i);
        let timelineInDays = 84;
        if (timelineMatch) {
          const num = parseInt(timelineMatch[1]);
          const unit = timelineMatch[2].toLowerCase()[0];
          const unitMap = { 'd': 1, 'w': 7, 'm': 30, 'y': 365 };
          timelineInDays = num * (unitMap[unit] || 1);
        }

        const quest = {
          id: Date.now().toString(),
          name: breakdown.affirmation || goal,
          currentProgress: progress,
          timeline: timeline,
          timelineInDays: timelineInDays,
          commitmentLevel: commitment,
          status: 'active',
          skillsets: breakdown.skillsets || [],
          habits: breakdown.habits || [],
          dailyObjectives: breakdown.dailyObjectives || [],
          milestones: breakdown.milestones || [],
          affirmation: breakdown.affirmation || '',
          quote: breakdown.quote || '',
          rewards: {}
        };

        quests.push(quest);
        localStorage.setItem('theSystemQuests', JSON.stringify(quests));
        closeModal();
        backToMain();

      } catch (err) {
        console.error('Quest generation error:', err);
        modal.innerHTML = `
          <div class="modal-title">Generation Failed</div>
          <div style="color: var(--warning); margin-bottom: 16px; font-size: 12px; line-height: 1.5; word-break: break-word;">
            <strong>Error: ${err.message}</strong>
            <br><br>
            <strong>Setup Checklist:</strong>
            <br>✓ Update the Vercel URL in the HTML (line ~1144)
            <br>✓ Go to <a href="https://build.nvidia.com" target="_blank" style="color: var(--primary); text-decoration: underline;">build.nvidia.com</a>
            <br>✓ Sign up (free, no credit card)
            <br>✓ Get your API key
            <br>✓ Copy the ENTIRE key (no spaces)
            <br>✓ Try again
          </div>
          <div class="confirm-buttons">
            <button class="confirm-btn confirm-yes" onclick="showEmbarkModal()">Try Again</button>
            <button class="confirm-btn confirm-no" onclick="closeModal()">Cancel</button>
          </div>
        `;
      }
    }

    function showModal(content) {
      const modal = document.getElementById('modal');
      modal.innerHTML = content;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }
